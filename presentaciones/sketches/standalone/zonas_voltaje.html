<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Zonas de voltaje — la fuente fija dos nodos</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0d0d1a;
      display: flex; flex-direction: column;
      justify-content: center; align-items: center;
      height: 100vh; font-family: monospace; color: #aaa;
    }
    canvas { display: block; }
    #hint { margin-top: 14px; font-size: 12px; opacity: 0.45; letter-spacing: 0.05em; }
  </style>
</head>
<body>
<div id="escenario"></div>
<div id="hint">ESPACIO voltaje · P cargas · C resistencia · E esquemático · R reinicia</div>
<script src="../../player/vendor/p5.min.js"></script>
<script src="../registro.js"></script>
<script src="../resistencias.js"></script>
<script src="../zonas_voltaje.js"></script>
<script>
  const handle = montarSketch('zonas_voltaje', document.getElementById('escenario'));
  // Fuera del player no hay quien enrute el teclado: se hace aquí.
  document.addEventListener('keydown', (e) => {
    if (e.code === 'KeyR') { handle.reiniciar(); return; }
    if (handle.tecla(e.code)) e.preventDefault();
  });
</script>
</body>
</html>
