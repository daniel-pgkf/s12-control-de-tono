<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Cañones — tiro parabólico contra una resistencia</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0d0d1a;
      display: flex; flex-direction: column;
      justify-content: center; align-items: center;
      height: 100vh; font-family: monospace; color: #aaa;
    }
    canvas { display: block; }
    #hint { margin-top: 14px; font-size: 12px; opacity: 0.45; letter-spacing: 0.05em; }
  </style>
</head>
<body>
<div id="escenario"></div>
<div id="hint">ESPACIO dispara · R reinicia</div>
<script src="../../player/vendor/p5.min.js"></script>
<script src="../registro.js"></script>
<script src="../resistencias.js"></script>
<script src="../canon_parabolico.js"></script>
<script>
  const handle = montarSketch('canon_parabolico', document.getElementById('escenario'));
  // Fuera del player no hay quien enrute el teclado: se hace aquí.
  document.addEventListener('keydown', (e) => {
    if (e.code === 'Space') { e.preventDefault(); handle.avanzarPaso(); }
    if (e.code === 'KeyR') handle.reiniciar();
  });
</script>
</body>
</html>
