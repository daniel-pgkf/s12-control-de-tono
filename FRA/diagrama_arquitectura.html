<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>FRA — Arquitectura del Sistema</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0f1117;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: 'Courier New', monospace;
      color: #ccc;
      padding: 32px;
    }
    h1 { font-size: 15px; letter-spacing: 0.15em; color: #7eb8f7; margin-bottom: 6px; text-transform: uppercase; }
    .subtitle { font-size: 11px; color: #555; margin-bottom: 32px; letter-spacing: 0.08em; }
    svg text { font-family: 'Courier New', monospace; }
  </style>
</head>
<body>
<h1>FRA — Frequency Response Analyzer</h1>
<p class="subtitle">Arquitectura del sistema · v0.1 · 2026-05-07</p>

<!-- SVG más alto para dar espacio a leyenda de 2 filas -->
<svg width="960" height="575" viewBox="0 0 960 575">
  <defs>
    <marker id="arr-blue"   markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4a9eff"/></marker>
    <marker id="arr-green"  markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4ecb71"/></marker>
    <marker id="arr-purple" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#b060e0"/></marker>
    <marker id="arr-yellow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#c0a020"/></marker>
    <marker id="arr-gray"   markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#7070c0"/></marker>
  </defs>

  <text x="480" y="26" text-anchor="middle" fill="#263040" font-size="10" letter-spacing="3">— RUTA DE SEÑAL DE AUDIO —</text>

  <!-- ══ JACK IN ══ -->
  <rect x="15" y="88" width="80" height="54" rx="6" fill="#1a2030" stroke="#4a9eff" stroke-width="1.5"/>
  <text x="55" y="110" text-anchor="middle" fill="#7eb8f7" font-size="11" font-weight="bold">JACK IN</text>
  <text x="55" y="126" text-anchor="middle" fill="#445" font-size="9">1/4" mono</text>
  <line x1="95" y1="115" x2="108" y2="115" stroke="#4a9eff" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <!-- ══ ACOND IN ══ -->
  <rect x="110" y="76" width="120" height="78" rx="6" fill="#1a2030" stroke="#4a9eff" stroke-width="1.5"/>
  <text x="170" y="97"  text-anchor="middle" fill="#7eb8f7" font-size="11" font-weight="bold">ACOND. IN</text>
  <line x1="124" y1="104" x2="216" y2="104" stroke="#223" stroke-width="1"/>
  <text x="170" y="118" text-anchor="middle" fill="#667" font-size="9">Buffer hi-Z ~1MΩ</text>
  <text x="170" y="132" text-anchor="middle" fill="#667" font-size="9">Pot. ganancia (panel)</text>
  <text x="170" y="146" text-anchor="middle" fill="#445" font-size="8">guitarra / línea</text>
  <!-- Flecha más larga → SW ENTRADA con más holgura -->
  <line x1="230" y1="115" x2="258" y2="115" stroke="#4a9eff" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <!-- ══ SW ENTRADA (desplazada +20px) ══ -->
  <rect x="262" y="88" width="92" height="54" rx="6" fill="#141420" stroke="#c0a020" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="308" y="108" text-anchor="middle" fill="#d0b030" font-size="10" font-weight="bold">SW ENTRADA</text>
  <text x="308" y="122" text-anchor="middle" fill="#806a20" font-size="8">Guitarra / Noise</text>
  <text x="308" y="134" text-anchor="middle" fill="#604e10" font-size="8">ctrl. μC</text>
  <line x1="354" y1="115" x2="373" y2="115" stroke="#4a9eff" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <!-- ══ ADC₁ (+20px) ══ -->
  <rect x="375" y="88" width="82" height="54" rx="6" fill="#101a18" stroke="#4ecb71" stroke-width="2"/>
  <text x="416" y="108" text-anchor="middle" fill="#4ecb71" font-size="12" font-weight="bold">ADC₁</text>
  <text x="416" y="122" text-anchor="middle" fill="#2a6a40" font-size="8">~96 kSps</text>
  <text x="416" y="134" text-anchor="middle" fill="#2a6a40" font-size="8">I²S</text>
  <line x1="457" y1="115" x2="473" y2="115" stroke="#4a9eff" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <!-- ══ DUT SLOT (+20px) ══ -->
  <rect x="475" y="56" width="122" height="118" rx="8" fill="#1c1806" stroke="#f0a020" stroke-width="2"/>
  <text x="536" y="79"  text-anchor="middle" fill="#f0a020" font-size="11" font-weight="bold">DUT SLOT</text>
  <text x="536" y="93"  text-anchor="middle" fill="#806010" font-size="8">4 puertos · modular</text>
  <line x1="488" y1="100" x2="584" y2="100" stroke="#302808" stroke-width="1"/>
  <text x="536" y="114" text-anchor="middle" fill="#604c10" font-size="8">IN+   IN−</text>
  <text x="536" y="128" text-anchor="middle" fill="#604c10" font-size="8">OUT+  OUT−</text>
  <line x1="488" y1="136" x2="584" y2="136" stroke="#302808" stroke-width="1"/>
  <text x="536" y="150" text-anchor="middle" fill="#403205" font-size="8">Filtro RC / Pedal</text>
  <text x="536" y="164" text-anchor="middle" fill="#403205" font-size="8">cualquier red 2P</text>
  <line x1="597" y1="115" x2="613" y2="115" stroke="#4a9eff" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <!-- ══ ADC₂ (+20px) ══ -->
  <rect x="615" y="88" width="82" height="54" rx="6" fill="#101a18" stroke="#4ecb71" stroke-width="2"/>
  <text x="656" y="108" text-anchor="middle" fill="#4ecb71" font-size="12" font-weight="bold">ADC₂</text>
  <text x="656" y="122" text-anchor="middle" fill="#2a6a40" font-size="8">~96 kSps</text>
  <text x="656" y="134" text-anchor="middle" fill="#2a6a40" font-size="8">I²S · sync ADC₁</text>
  <line x1="697" y1="115" x2="713" y2="115" stroke="#4a9eff" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <!-- ══ ACOND OUT (+20px) ══ -->
  <rect x="715" y="88" width="102" height="54" rx="6" fill="#1a2030" stroke="#4a9eff" stroke-width="1.5"/>
  <text x="766" y="108" text-anchor="middle" fill="#7eb8f7" font-size="11" font-weight="bold">ACOND. OUT</text>
  <text x="766" y="122" text-anchor="middle" fill="#667" font-size="8">Buffer salida</text>
  <text x="766" y="134" text-anchor="middle" fill="#667" font-size="8">Driver speaker</text>
  <line x1="817" y1="115" x2="833" y2="115" stroke="#4a9eff" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <!-- ══ JACK OUT (+20px) ══ -->
  <rect x="835" y="88" width="80" height="54" rx="6" fill="#1a2030" stroke="#4a9eff" stroke-width="1.5"/>
  <text x="875" y="110" text-anchor="middle" fill="#7eb8f7" font-size="11" font-weight="bold">JACK OUT</text>
  <text x="875" y="126" text-anchor="middle" fill="#445" font-size="9">1/4" mono</text>

  <!-- ═══════════════════════════════════════════════════════════ -->
  <!-- GEN. RUIDO BLANCO (izquierda, flecha entra a SW por izq)   -->
  <!-- ═══════════════════════════════════════════════════════════ -->
  <rect x="15" y="200" width="122" height="58" rx="6" fill="#14101e" stroke="#b060e0" stroke-width="1.5"/>
  <text x="76" y="221" text-anchor="middle" fill="#c070f0" font-size="10" font-weight="bold">GEN. RUIDO</text>
  <text x="76" y="235" text-anchor="middle" fill="#c070f0" font-size="10" font-weight="bold">BLANCO</text>
  <text x="76" y="250" text-anchor="middle" fill="#705090" font-size="8">activo en modo Bode</text>
  <!-- Derecha hasta x=257 (antes del borde izq de SW en 262), luego sube -->
  <path d="M 137 229 L 257 229 L 257 115"
        fill="none" stroke="#b060e0" stroke-width="1.5" stroke-dasharray="4,2"
        marker-end="url(#arr-purple)"/>
  <text x="198" y="222" text-anchor="middle" fill="#6030a0" font-size="8">señal</text>

  <!-- ═══════════════════════════════════════════════════════════ -->
  <!-- μC → SW ENTRADA: ctrl bypass (L-shape, no cruza las I²S)   -->
  <!-- Sale del borde izq del μC (x=310), sube, va izq, entra SW  -->
  <!-- ═══════════════════════════════════════════════════════════ -->
  <path d="M 326 305 L 326 178 L 288 178 L 288 142"
        fill="none" stroke="#c0a020" stroke-width="1" stroke-dasharray="4,2"
        marker-end="url(#arr-yellow)"/>
  <text x="310" y="172" text-anchor="middle" fill="#705800" font-size="8">ctrl bypass</text>

  <!-- ═══════════════════════════════════════════════════════════ -->
  <!-- I²S: ADC₁ → μC  y  ADC₂ → μC  (verticales rectas)        -->
  <!-- ═══════════════════════════════════════════════════════════ -->
  <line x1="416" y1="142" x2="416" y2="303"
        stroke="#4ecb71" stroke-width="1.5" stroke-dasharray="4,3"
        marker-end="url(#arr-green)"/>
  <text x="424" y="230" fill="#1a5030" font-size="8">I²S</text>

  <line x1="656" y1="142" x2="656" y2="303"
        stroke="#4ecb71" stroke-width="1.5" stroke-dasharray="4,3"
        marker-end="url(#arr-green)"/>
  <text x="664" y="230" fill="#1a5030" font-size="8">I²S</text>

  <!-- ═══════════════════════════════════════════════════════════ -->
  <!-- μC (+20px)                                                  -->
  <!-- ═══════════════════════════════════════════════════════════ -->
  <rect x="310" y="305" width="440" height="145" rx="8" fill="#0c1418" stroke="#4a9eff" stroke-width="2"/>
  <text x="530" y="328" text-anchor="middle" fill="#7eb8f7" font-size="12" font-weight="bold">μC — ESP32-C3 Mini</text>
  <line x1="325" y1="335" x2="735" y2="335" stroke="#1a2535" stroke-width="1"/>
  <text x="348" y="352" fill="#3a5870" font-size="9">· Captura I²S simultánea (ADC₁ + ADC₂)</text>
  <text x="348" y="367" fill="#3a5870" font-size="9">· FFT entrada / salida</text>
  <text x="348" y="382" fill="#3a5870" font-size="9">· Cálculo magnitud + fase → Bode</text>
  <text x="348" y="397" fill="#3a5870" font-size="9">· Control SW entrada (modo efecto / modo Bode)</text>
  <text x="348" y="412" fill="#3a5870" font-size="9">· Lectura footswitch + 6 botones</text>
  <text x="348" y="427" fill="#3a5870" font-size="9">· Envío datos → PC por USB</text>

  <!-- μC → PC -->
  <line x1="750" y1="375" x2="768" y2="375" stroke="#4a9eff" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="759" y="369" text-anchor="middle" fill="#2a4060" font-size="8">USB</text>

  <!-- ══ PC ══ -->
  <rect x="770" y="345" width="110" height="60" rx="6" fill="#1a2030" stroke="#4a9eff" stroke-width="1.5"/>
  <text x="825" y="368" text-anchor="middle" fill="#7eb8f7" font-size="12" font-weight="bold">PC</text>
  <text x="825" y="382" text-anchor="middle" fill="#3a5870" font-size="8">Visualización</text>
  <text x="825" y="396" text-anchor="middle" fill="#3a5870" font-size="8">Bode / Espectro</text>

  <!-- ═══════════════════════════════════════════════════════════ -->
  <!-- CONTROLES                                                    -->
  <!-- Footswitch: baja, rodea botones, entra al μC por abajo      -->
  <!-- Botones: horizontal directo                                  -->
  <!-- ═══════════════════════════════════════════════════════════ -->

  <!-- Footswitch -->
  <rect x="15" y="305" width="115" height="60" rx="6" fill="#101c10" stroke="#4ecb71" stroke-width="1.5"/>
  <text x="72" y="327" text-anchor="middle" fill="#4ecb71" font-size="10" font-weight="bold">FOOTSWITCH</text>
  <text x="72" y="341" text-anchor="middle" fill="#2a5a28" font-size="8">Efecto ON / Bypass</text>
  <text x="72" y="355" text-anchor="middle" fill="#2a5a28" font-size="8">activa ruido blanco</text>
  <!-- Baja, pasa por debajo de botones, entra al μC -->
  <path d="M 130 335 L 130 378 L 308 378"
        fill="none" stroke="#4ecb71" stroke-width="1.5"
        marker-end="url(#arr-green)"/>

  <!-- 6× Botones -->
  <rect x="150" y="305" width="115" height="60" rx="6" fill="#101018" stroke="#7070c0" stroke-width="1.5"/>
  <text x="207" y="327" text-anchor="middle" fill="#9090e0" font-size="10" font-weight="bold">6× BOTONES</text>
  <text x="207" y="341" text-anchor="middle" fill="#484870" font-size="8">100% programables</text>
  <text x="207" y="355" text-anchor="middle" fill="#484870" font-size="8">GPIOs del μC</text>
  <!-- Horizontal directo -->
  <line x1="265" y1="348" x2="308" y2="348"
        stroke="#7070c0" stroke-width="1.5"
        marker-end="url(#arr-gray)"/>

  <!-- ═══════════════════════════════════════════════════════════ -->
  <!-- LEYENDA — 2 filas separadas                                 -->
  <!-- ═══════════════════════════════════════════════════════════ -->
  <rect x="15" y="463" width="930" height="98" rx="6" fill="#0a0c10" stroke="#1a2030" stroke-width="1"/>
  <text x="35" y="481" fill="#445" font-size="9" font-weight="bold" letter-spacing="1">MODOS DE OPERACIÓN</text>

  <!-- Fila 1: Modo Espectro -->
  <circle cx="30" cy="498" r="4" fill="#4a9eff"/>
  <text x="42" y="502" fill="#7eb8f7" font-size="9" font-weight="bold">Modo Espectro (efecto ON):</text>
  <text x="42" y="516" fill="#556" font-size="9">Guitarra → DUT → salida. ADC₁ y ADC₂ monitorean en tiempo real. PC muestra espectros de entrada y salida simultáneamente.</text>

  <!-- Separador -->
  <line x1="30" y1="524" x2="930" y2="524" stroke="#1a2030" stroke-width="1"/>

  <!-- Fila 2: Modo Bode -->
  <circle cx="30" cy="540" r="4" fill="#b060e0"/>
  <text x="42" y="544" fill="#c070f0" font-size="9" font-weight="bold">Modo Bode (bypass ON):</text>
  <text x="42" y="557" fill="#556" font-size="9">Ruido blanco → DUT. ADC₁ y ADC₂ comparan espectros (magnitud + fase). PC calcula y grafica el diagrama de Bode automáticamente.</text>

</svg>
</body>
</html>
